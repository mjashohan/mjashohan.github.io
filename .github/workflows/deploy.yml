name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy: sha-xxxxxxx (from a Build image run) or latest"
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(sha-[0-9a-f]{7}|latest)$ ]]; then
            echo "::error::Version must be sha-xxxxxxx or latest, got: $VERSION"
            exit 1
          fi

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy on tardis
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.TARDIS_KNOWN_HOSTS }}
          VERSION: ${{ inputs.version }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 \
              deploy@100.77.7.120 portfolio "$VERSION"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "### Deployed portfolio \`$VERSION\` to mjashohan.com" >> $GITHUB_STEP_SUMMARY